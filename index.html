<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <div class="head">
      <div class="head__container">
        <img src="/img/logo.png" alt="" />
        <div class="head__link">
          <a href="#" class="link">Главная</a>

          <a href="#" class="link">Про гида</a>

          <a href="#" class="link">Программа тура</a>

          <a href="#" class="link">Стоимость</a>

          <a href="#" class="link">Блог</a>

          <a href="#" class="link">Контакты</a>

          <button class="head__button">Консультация</button>
        </div>
      </div>
      <div class="reg__container">
        <p class="reg__text">
          Насладись прогулкой в горах <br />
          с командой единомышлеников
        </p>
        <div class="reg__field">
          <form method="post" id="tourReg" action="#" class="form__tour">
            <div class="reg__button">
              <label for="location">Выберите локацию для тура</label>
              <select id="country" name="country">
                <option value=""></option>
                <option value="Russia">Россия</option>
                <option value="Georgia">Грузия</option>
                <option value="Armenia">Армения</option>
              </select>
            </div>
            <div class="reg__date">
              <label for="dateFirst">От</label>
              <input type="date" id="dateFirst" name="dateFirst" />

              <label for="dateSecond">До</label>
              <input type="date" id="dateSecond" name="dateSecond" />
              <span class="reg__discription">Укажите диапазон</span>
            </div>
            <div class="reg__button">
              <label for="people">Введите количество людей</label>
              <input
                type="number"
                minlength="4"
                maxlength="20"
                id="people"
                name="people"
              />
              <span class="reg__discription">Минимум 4 человека</span>
            </div>
            <button type="submit" class="search__button">
              Найти программу
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
